plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.rekijan.initiativetrackersecondedition'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.rekijan.initiativetrackersecondedition"
        minSdk 27
        targetSdk 37
        versionCode 14
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
            release {
                storeFile file(project.property("REKIJAN_UPLOAD_STORE_FILE"))
                storePassword project.findProperty("REKIJAN_UPLOAD_STORE_PASSWORD")
                keyAlias project.property("REKIJAN_UPLOAD_KEY_ALIAS")
                keyPassword project.findProperty("REKIJAN_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.gson
    implementation libs.billing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
