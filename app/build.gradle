plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.rekijan.initiativetrackersecondedition'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.rekijan.initiativetrackersecondedition"
        minSdk 27
        targetSdk 37
        versionCode 14
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
            release {
                storeFile file(project.property("REKIJAN_UPLOAD_STORE_FILE"))
                storePassword project.findProperty("REKIJAN_UPLOAD_STORE_PASSWORD")
                keyAlias project.property("REKIJAN_UPLOAD_KEY_ALIAS")
                keyPassword project.findProperty("REKIJAN_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Google's sample IDs, safe to tap while testing
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
        }
        release {
            // PF2 Combat Tracker's AdMob app and banner ad unit
            manifestPlaceholders = [admobAppId: "ca-app-pub-8520752189469314~8582279081"]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-8520752189469314/1497995988\""
            if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.gson
    implementation libs.billing
    implementation libs.rekijan.ads
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.firebase.auth
    debugImplementation libs.firebase.appcheck.debug
    releaseImplementation libs.firebase.appcheck.playintegrity
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
